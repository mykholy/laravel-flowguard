name: Outbox Stress (manual)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Independent PHP workers; 500 requires tuned infrastructure
        required: true
        type: choice
        options: ['10', '100', '500']
        default: '10'
      messages_per_worker:
        description: Seeded messages per worker
        required: true
        type: choice
        options: ['1', '2', '5']
        default: '2'

permissions:
  contents: read

jobs:
  stress:
    name: ${{ matrix.db }} · ${{ inputs.workers }} workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_flowguard_ci
          MYSQL_DATABASE: flowguard_ci
          MYSQL_USER: flowguard
          MYSQL_PASSWORD: flowguard
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uflowguard -pflowguard"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowguard_ci
          POSTGRES_USER: flowguard
          POSTGRES_PASSWORD: flowguard
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U flowguard -d flowguard_ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      FLOWGUARD_CONCURRENCY_TEST: '1'
      FLOWGUARD_STRESS_CONFIRM: disposable-only
      FLOWGUARD_STRESS_WORKERS: ${{ inputs.workers }}
      FLOWGUARD_STRESS_MESSAGES_PER_WORKER: ${{ inputs.messages_per_worker }}
      FLOWGUARD_TEST_DATABASE: flowguard_ci
      FLOWGUARD_TEST_DRIVER: ${{ matrix.db }}
      FLOWGUARD_TEST_HOST: 127.0.0.1
      FLOWGUARD_TEST_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      FLOWGUARD_TEST_USERNAME: flowguard
      FLOWGUARD_TEST_PASSWORD: flowguard
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer require --dev 'orchestra/testbench:^11.0' 'laravel/framework:^13.0' --with-all-dependencies --no-interaction --no-progress
      - name: Run isolated contention test
        run: php tests/Stress/run.php
