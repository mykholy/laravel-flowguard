name: Clean Laravel Installation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installation:
    name: Fresh Laravel ${{ matrix.laravel }} · ${{ matrix.db }} · PHP 8.3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_flowguard_ci
          MYSQL_DATABASE: flowguard_ci
          MYSQL_USER: flowguard
          MYSQL_PASSWORD: flowguard
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uflowguard -pflowguard"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowguard_ci
          POSTGRES_USER: flowguard
          POSTGRES_PASSWORD: flowguard
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U flowguard -d flowguard_ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || '3306' }}
      DB_USERNAME: flowguard
      DB_PASSWORD: flowguard
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql, dom, xml
          coverage: none
          tools: composer:v2
      - name: Create clean Laravel application
        run: composer create-project "laravel/laravel:^${{ matrix.laravel }}" smoke-app --no-interaction --prefer-dist --no-progress
      - name: Install Flowguard from local source tree
        working-directory: smoke-app
        run: |
          composer config repositories.flowguard path ../
          composer require 'mykholy/laravel-flowguard:@dev' --no-interaction --with-all-dependencies --no-progress
      - name: Select disposable database
        working-directory: smoke-app
        run: |
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            touch database/database.sqlite
            echo "DB_CONNECTION=sqlite" >> "$GITHUB_ENV"
            echo "DB_DATABASE=$PWD/database/database.sqlite" >> "$GITHUB_ENV"
          else
            echo "DB_CONNECTION=${{ matrix.db }}" >> "$GITHUB_ENV"
            echo "DB_DATABASE=flowguard_ci" >> "$GITHUB_ENV"
          fi
      - name: Migrate and diagnose clean database
        working-directory: smoke-app
        run: |
          php artisan key:generate
          php artisan migrate --force
          php artisan flowguard:doctor
      - name: Verify framework integration
        working-directory: smoke-app
        run: php ../tests/Installation/verify.php
      - name: Verify populated lease schema upgrade in isolated SQLite database
        working-directory: smoke-app
        run: php ../tests/Installation/outbox-upgrade.php
