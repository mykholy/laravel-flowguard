name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} · static + SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer analyse
      - run: composer format-check
      - run: php tests/smoke.php

  concurrency:
    name: ${{ matrix.db }} · independent PHP workers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_flowguard_ci
          MYSQL_DATABASE: flowguard_ci
          MYSQL_USER: flowguard
          MYSQL_PASSWORD: flowguard
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uflowguard -pflowguard"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowguard_ci
          POSTGRES_USER: flowguard
          POSTGRES_PASSWORD: flowguard
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U flowguard -d flowguard_ci"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      FLOWGUARD_CONCURRENCY_TEST: '1'
      FLOWGUARD_TEST_DATABASE: flowguard_ci
      FLOWGUARD_TEST_DRIVER: ${{ matrix.db }}
      FLOWGUARD_TEST_HOST: 127.0.0.1
      FLOWGUARD_TEST_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      FLOWGUARD_TEST_USERNAME: flowguard
      FLOWGUARD_TEST_PASSWORD: flowguard
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:concurrency

  pint_export:
    name: Temporary Pint formatting export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer format
      - name: Emit formatted files for deterministic source update
        shell: bash
        run: |
          while IFS= read -r path; do
            printf 'FLOWGUARD_PINT:%s:%s\n' "$path" "$(base64 -w0 "$path")"
          done < <(git diff --name-only -- '*.php')
