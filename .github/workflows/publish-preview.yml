name: Publish Versioned Beta

on:
  pull_request:
    paths:
      - .release/**
      - .github/workflows/publish-preview.yml
      - tools/check-preview-release.cjs
  push:
    branches: [main]
    paths:
      - .release/**
      - .github/workflows/publish-preview.yml
      - tools/check-preview-release.cjs

permissions:
  contents: read

concurrency:
  group: flowguard-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/check-preview-release.cjs

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for exact-commit compatibility, installation, and restore checks
        uses: actions/github-script@v7
        with:
          script: |
            const paths = ['.github/workflows/ci.yml', '.github/workflows/clean-install.yml', '.github/workflows/native-restore.yml'];
            for (let attempt = 0; attempt < 90; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, branch: 'main', event: 'push', per_page: 100
              });
              const runs = paths.map(path => response.data.workflow_runs.find(run => run.path === path));
              const failure = runs.find(run => run && run.status === 'completed' && run.conclusion !== 'success');
              if (failure) throw new Error(`Required workflow failed: ${failure.html_url}`);
              if (runs.every(run => run && run.status === 'completed' && run.conclusion === 'success')) {
                for (const run of runs) core.info(`Verified ${run.html_url} at ${context.sha}`);
                return;
              }
              core.info('Waiting for all required workflows on the release commit.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Required release checks did not finish before the deadline.');
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, dom, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Build verified distribution and publish immutable beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/check-preview-release.cjs
          tag=$(node -p "require('./.release/preview.json').tag")
          notes=$(node -p "require('./.release/preview.json').notes")
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing to replace a published version.'
            exit 1
          fi
          composer validate --strict
          composer archive --format=zip --dir=dist --file=flowguard
          php tools/check-distribution.php dist/flowguard.zip
          (cd dist && sha256sum flowguard.zip > flowguard.sha256)
          gh release create "$tag" dist/flowguard.zip dist/flowguard.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Laravel Flowguard $tag" --notes-file "$notes" --prerelease --latest=false
      - name: Wait for Packagist to index the exact beta commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('.release/preview.json')).tag.slice(1);
            for (let attempt = 0; attempt < 45; attempt++) {
              const response = await fetch('https://repo.packagist.org/p2/mykholy/laravel-flowguard.json');
              if (response.ok) {
                const data = await response.json();
                const entry = (data.packages?.['mykholy/laravel-flowguard'] || []).find(p => p.version?.replace(/^v/, '') === version);
                if (entry) {
                  if (entry.source?.reference !== context.sha) throw new Error('Packagist indexed a different source commit.');
                  core.info(`Packagist indexed ${version} at ${context.sha}`);
                  return;
                }
              }
              core.info('Waiting for Packagist indexing.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('GitHub beta published, but Packagist indexing is not verified. Check its update hook.');
      - name: Install the public Packagist beta in a fresh Laravel application
        shell: bash
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/flowguard-beta.sqlite
        run: |
          tag=$(node -p "require('./.release/preview.json').tag")
          touch "$DB_DATABASE"
          composer create-project 'laravel/laravel:^13.0' "$RUNNER_TEMP/flowguard-beta-app" --no-interaction --prefer-dist --no-progress
          cd "$RUNNER_TEMP/flowguard-beta-app"
          composer require "mykholy/laravel-flowguard:${tag#v}" --no-interaction --prefer-dist --no-progress
          node -e 'const p = require("./composer.lock").packages.find(p => p.name === "mykholy/laravel-flowguard"); if (p?.source?.reference !== process.env.GITHUB_SHA) throw new Error("Installed source does not match the release commit");'
          php artisan key:generate
          php artisan migrate --force
          php artisan flowguard:doctor
          php "$GITHUB_WORKSPACE/tests/Installation/verify.php"
