name: Publish Versioned Beta

on:
  pull_request:
    paths:
      - .release/**
      - .github/workflows/publish-preview.yml
      - tools/check-preview-release.cjs
      - tools/verify-public-install.sh
  push:
    branches: [main]
    paths:
      - .release/**
      - .github/workflows/publish-preview.yml
      - tools/check-preview-release.cjs
      - tools/verify-public-install.sh

permissions:
  contents: read

concurrency:
  group: flowguard-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/check-preview-release.cjs

  public-install:
    if: github.event_name == 'pull_request'
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, dom, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Verify existing beta from public Packagist
        shell: bash
        run: |
          tag=$(node -p "require('./.release/preview.json').tag")
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            bash tools/verify-public-install.sh
          else
            echo 'No existing public tag yet; the publish job will verify after creation.'
          fi

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release source
        shell: bash
        run: |
          tag=$(node -p "require('./.release/preview.json').tag")
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "RELEASE_SHA=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Wait for exact-commit compatibility, installation, demo, and restore checks
        uses: actions/github-script@v7
        with:
          script: |
            const paths = ['.github/workflows/ci.yml', '.github/workflows/clean-install.yml', '.github/workflows/native-restore.yml', '.github/workflows/demo-host.yml'];
            for (let attempt = 0; attempt < 90; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: process.env.RELEASE_SHA, branch: 'main', event: 'push', per_page: 100
              });
              const runs = paths.map(path => response.data.workflow_runs.find(run => run.path === path));
              const failure = runs.find(run => run && run.status === 'completed' && run.conclusion !== 'success');
              if (failure) throw new Error(`Required workflow failed: ${failure.html_url}`);
              if (runs.every(run => run && run.status === 'completed' && run.conclusion === 'success')) {
                for (const run of runs) core.info(`Verified ${run.html_url} at ${process.env.RELEASE_SHA}`);
                return;
              }
              core.info('Waiting for all required workflows on the release commit.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Required release checks did not finish before the deadline.');
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, dom, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Build verified distribution and publish immutable beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/check-preview-release.cjs
          tag=$(node -p "require('./.release/preview.json').tag")
          notes=$(node -p "require('./.release/preview.json').notes")
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            echo 'Existing beta retained unchanged; resuming public installation verification.'
            exit 0
          fi
          composer validate --strict
          composer archive --format=zip --dir=dist --file=flowguard
          php tools/check-distribution.php dist/flowguard.zip
          (cd dist && sha256sum flowguard.zip > flowguard.sha256)
          gh release create "$tag" dist/flowguard.zip dist/flowguard.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Laravel Flowguard $tag" --notes-file "$notes" --prerelease --latest=false
      - name: Wait for Packagist to index the exact beta commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('.release/preview.json')).tag.slice(1);
            for (let attempt = 0; attempt < 45; attempt++) {
              const response = await fetch('https://repo.packagist.org/p2/mykholy/laravel-flowguard.json');
              if (response.ok) {
                const data = await response.json();
                const entry = (data.packages?.['mykholy/laravel-flowguard'] || []).find(p => p.version?.replace(/^v/, '') === version);
                if (entry) {
                  if (entry.source?.reference !== process.env.RELEASE_SHA) throw new Error('Packagist indexed a different source commit.');
                  core.info(`Packagist indexed ${version} at ${process.env.RELEASE_SHA}`);
                  return;
                }
              }
              core.info('Waiting for Packagist indexing.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('GitHub beta published, but Packagist indexing is not verified. Check its update hook.');
      - name: Install the public Packagist beta in a fresh Laravel application
        shell: bash
        run: |
          git fetch origin --tags
          bash tools/verify-public-install.sh
